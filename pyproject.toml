[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "noise-suppression-claim-audit"
version = "0.1.0"
description = "Offline documentation and Python evidence auditor"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"

[project.scripts]
noise-suppression-claim-audit = "noise_suppression_claim_audit.audit:main"

[tool.setuptools.packages.find]
include = ["noise_suppression_claim_audit*"]
